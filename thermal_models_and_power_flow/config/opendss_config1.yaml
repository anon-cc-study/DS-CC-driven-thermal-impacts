## Simulation Mode 
solution_mode: 'snapshot' # 0 snapshot (hourly) | 1 daily | 2 yearly [more modes here: https://opendss.epri.com/Mode2.html]
line_rating_mode: 'heat_balance_linear_proxy' # Based on IEEE 738 standard (see Methods)
transformers_rating_mode: 'ieee_linear_proxy' # Based on IEEE C57.91 standard (see Methods)
 
# Solar-battery scenarios 
solar_share: none #  none | low | medium | high | extreme
battery_share: none # none | low | high


# Demo run:
TGW_years_scenarios:
  '2018': ["historical"] # Select year amd emissions scenario: historical (for TGW_weather_year < 2020) | rcp45cooler | rcp45hotter | rcp85cooler  | rcp85hotter

# Demo run:
TGW_years_scenarios_ranges:
  - start_year: 2018
    end_year: 2018
    scenarios: ["historical"]

# # full range of weather scenarios 
# TGW_years_scenarios_ranges:
#   - start_year: 1990
#     end_year: 2019
#     scenarios: ["historical"]
#   - start_year: 2030
#     end_year: 2059
#     scenarios: ["rcp45hotter"]  
   
   
# Demo run:
CITY_REGIONS_TO_RUN:
   GSO: ["rural"]

# full set of cities and regions for power flow simulation:
# CITY_REGIONS_TO_RUN:
#    AUS: ["P1R", "P1U", "P2U"]
#    GSO: ["rural", "industrial", "urban-suburban"]
#    SFO: ["P1U", "P2U", "P1R"]
   
   
### Select distribution data year: 2016-18
# Demo run:
smart_ds_years:
  - "2018"
  
# Select the month range from which high-demand hours are drawn (inclusive)
start_month_mdh: 6 
end_month_mdh: 9

# Number of selected hours is defined as a percentage of all 8,760 annual hours:
# n_hours = ceil(8760 * top_percent_mdh / 100).
# The n_hours highest-demand hours are then selected from the month range above.
start_row_percent: 0  
top_percent_mdh: 10
  
## Select level of aggregation for electricity demand forecasting  
aggregation_level: "feeder"  # building | feeder | regional
#### Select Model training/prediction paramaters ####
Y_column: "cooling_kw_sum"  # output label options:  total_site_electricity_kw | cooling_kw | cooling_kw_sum | heating_kw | 
X_columns_set: "X_columns_D" # default option. input features options: X_columns_A (time+weather) | X_columns_B (only high corr weather) | X_columns_C (only temp) | X_columns_D (additional features)
demand_mode: 'MLP' # MLP | linear | none
# Define months for training: load and weather data (inclusive)
start_month: 1
end_month: 12
# Define building types to loop over
building_types: ["res", "com"]


## Define paths
input_data_dict_name: "input_data_dict_proc" # input_data_dict_proc -  Input data with additional features and without redundant features | 'input_data_dict' - Raw data with minimal processing
# Define default paths for saving/loading input and output data (path is updated by internal function in /src for the correct months and aggregation level)
input_data_training_path: "main_folder/load_prediction/results/data/training/2018/months_6_8/ml_input_data/resstock/amy2018/regional/" 
output_data_training_path: "main_folder/load_prediction/results/data/training/2018/months_6_8/ml_output_data/total_site_electricity_kw/regional/" 
input_data_prediction_path: "main_folder/load_prediction/results/data/prediction/input/TGW_weather/Concord/Historical/" 
output_data_prediction_path: "main_folder/load_prediction/results/data/prediction/output/2018/months_1_12/heating_kw/feature_A/regional/all_regions" 
smart_ds_load_path: "main_folder/load_prediction/results/data/smart_ds_load"
output_pf_path: "main_folder/OpenDSS/results/data/network_performance" 

